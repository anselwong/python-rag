[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-rag"
version = "0.1.0"
description = "RAG knowledge base API"
# 结构化解析栈（Docling/Pandas）以 Docker 内的 Python 3.11 为兼容基线。
# 不能继续声称 3.9 可完整运行，否则本地安装会得到与生产不同的依赖解析结果。
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "dashscope>=1.24,<2.0",
  "docling>=2,<3",
  "pypdf>=6.0,<7.0",
  "pdfplumber>=0.11,<1.0",
  "pgvector>=0.3,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "langchain-core>=0.3,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-text-splitters>=0.3,<1.0",
  "langchain-postgres>=0.0.12,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.3,<7.0",
  "markdown-it-py>=3.0,<4.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "xlrd>=2.0,<3.0",
  "tiktoken>=0.8,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
